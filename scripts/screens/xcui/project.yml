name: LPShots
options:
  bundleIdPrefix: com.example.lpshots
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lpshots.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ShotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShotsUITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lpshots.uitests
        TEST_TARGET_NAME: Host
schemes:
  LPShots:
    build:
      targets: {Host: all, ShotsUITests: [test]}
    test:
      targets: [ShotsUITests]
