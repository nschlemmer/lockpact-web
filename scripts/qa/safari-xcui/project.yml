name: LPSafari
options:
  bundleIdPrefix: com.example.lpsafari
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lpsafari.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SafariUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SafariUITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lpsafari.uitests
        TEST_TARGET_NAME: Host
schemes:
  LPSafari:
    build:
      targets: {Host: all, SafariUITests: [test]}
    test:
      targets: [SafariUITests]
